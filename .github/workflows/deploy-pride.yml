# Release zip for the studio-rental client: https://pride.viralsakhiya.com/pride/
#
# Push (or merge main) into `deploy/pride`, or run it from Actions → "Build · pride" → Run workflow.
# Download the zip from the run's "Artifacts" and extract it into the hosting's pride/ folder.
#
# GitHub → Settings → Secrets and variables → Actions → Variables (not secret, the app ships them anyway):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
name: Build · pride

on:
  push:
    branches: [deploy/pride]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /pride/
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # the webhook pass-through needs the Supabase address
      - run: sed -i "s#__SUPABASE_URL__#${VITE_SUPABASE_URL}#" dist/api/lead-webhook.php
      - uses: actions/upload-artifact@v4
        with:
          name: bizdock-pride
          path: dist/
          include-hidden-files: true   # keeps .htaccess
